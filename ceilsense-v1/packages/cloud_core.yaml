substitutions:
  cloud_enabled: "true"
  cloud_api_url: "https://api.smarthomeshop.io"
  cloud_api_version: "v1"
  cloud_sync_interval: "60s"
  cloud_presence_sync_interval: "10s"

globals:
  - id: cloud_device_token
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: cloud_device_id
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: cloud_is_registered
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_is_registering
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_last_sync_success
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_sync_failures
    type: int
    restore_value: false
    initial_value: "0"
  - id: cloud_first_sync_timestamp
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: cloud_last_presence_signature
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_has_scd4x
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_scd4x_temperature
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_scd4x_humidity
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_scd4x_co2
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_has_presence
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_moving_target
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_still_target
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_has_zone_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone1_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone2_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone3_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone4_occupancy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_has_zone_counts
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone1_target_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone2_target_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone3_target_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone4_target_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_configuration_syncing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_configuration_boot_sync_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_led_configuration_version
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: cloud_desired_configuration_version
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_led_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: cloud_motion_light_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: cloud_motion_light_brightness
    type: int
    restore_value: true
    initial_value: "70"
  - id: cloud_night_light_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: cloud_night_light_brightness
    type: int
    restore_value: true
    initial_value: "10"
  - id: cloud_night_light_start_hour
    type: int
    restore_value: true
    initial_value: "22"
  - id: cloud_night_light_end_hour
    type: int
    restore_value: true
    initial_value: "7"
  - id: cloud_co2_alert_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: cloud_co2_warning_ppm
    type: int
    restore_value: true
    initial_value: "1000"
  - id: cloud_co2_critical_ppm
    type: int
    restore_value: true
    initial_value: "1500"
  - id: cloud_co2_alert_cooldown_minutes
    type: int
    restore_value: true
    initial_value: "5"
  - id: cloud_configuration_has_presence
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_configuration_has_co2
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_configuration_ack_version
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_configuration_ack_applied
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_configuration_ack_error
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: cloud_led_alert_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_last_co2_alert_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_last_co2_alert_severity
    type: int
    restore_value: false
    initial_value: "0"
  - id: cloud_led_runtime_state
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_last_network_connected
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: template
    id: cloud_connected
    name: "${friendly_name} Cloud Connected"
    icon: "mdi:cloud-check"
    entity_category: diagnostic
    lambda: |-
      return id(cloud_is_registered) && id(cloud_last_sync_success);

sensor:
  - platform: template
    id: cloud_sync_failure_count
    name: "${friendly_name} Cloud Sync Failures"
    entity_category: diagnostic
    icon: "mdi:alert-circle"
    accuracy_decimals: 0
    lambda: |-
      return id(cloud_sync_failures);
    update_interval: 60s

text_sensor:
  - platform: template
    id: cloud_device_id_sensor
    name: "${friendly_name} Cloud Device ID"
    entity_category: diagnostic
    icon: "mdi:cloud-outline"
    lambda: |-
      if (id(cloud_device_id).length() > 0) {
        return id(cloud_device_id);
      }
      return {"Not registered"};
    update_interval: 60s

  - platform: template
    id: cloud_status_text
    name: "${friendly_name} Cloud Status"
    entity_category: diagnostic
    icon: "mdi:cloud-question"
    lambda: |-
      if (!id(cloud_is_registered)) {
        return {"Registering..."};
      }
      if (id(cloud_device_token).length() == 0) {
        return {"No token"};
      }
      if (id(cloud_sync_failures) > 10) {
        return {"Error: Too many failures"};
      }
      if (id(cloud_last_sync_success)) {
        return {"Connected"};
      }
      return {"Syncing..."};
    update_interval: 15s

button:
  - platform: template
    id: cloud_reset_button
    name: "${friendly_name} Reset Cloud"
    icon: "mdi:cloud-off"
    entity_category: config
    on_press:
      - script.execute: cloud_reset

script:
  - id: cloud_register
    mode: single
    then:
      - if:
          condition:
            not:
              lambda: "return network::is_connected();"
          then:
            - logger.log:
                level: DEBUG
                format: "Skipping cloud registration because the network is not connected"
            - script.stop: cloud_register
      - if:
          condition:
            lambda: "return id(cloud_is_registering);"
          then:
            - logger.log:
                level: DEBUG
                format: "Registration already in progress, skipping"
            - script.stop: cloud_register

      - lambda: "id(cloud_is_registering) = true;"

      - logger.log:
          level: INFO
          format: "Starting cloud registration..."

      - wait_until:
          condition:
            lambda: "return id(wifi_mac).has_state();"
          timeout: 30s

      - wait_until:
          condition:
            lambda: "return id(wifi_ip).has_state();"
          timeout: 30s

      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/register"
          request_headers:
            Content-Type: "application/json"
            User-Agent: "CeilSense/${project_version}"
            Accept: "application/json"
          json: |-
            root["mac_address"] = id(wifi_mac).state;
            root["hardware_version"] = "${ceilsense_hardware_version}";
            root["firmware_version"] = "${project_version}";
            root["product"] = "ceilsense";
            root["configuration_protocol_version"] = 1;
            if (id(wifi_ip).has_state()) {
              root["local_ip"] = id(wifi_ip).state;
            }
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  id(cloud_is_registering) = false;

                  if (response->status_code == 200 || response->status_code == 201) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["device_id"].is<const char *>() && root["token"].is<const char *>()) {
                        id(cloud_device_id) = root["device_id"].as<std::string>();
                        id(cloud_device_token) = root["token"].as<std::string>();
                        id(cloud_is_registered) = true;
                        id(cloud_sync_failures) = 0;
                        if (root["configuration_version"].is<uint32_t>()) {
                          id(cloud_desired_configuration_version) = root["configuration_version"].as<uint32_t>();
                        }
                        return true;
                      }

                      return false;
                    });
                  } else if (response->status_code == 422) {
                    id(cloud_sync_failures)++;
                  } else if (response->status_code == 429) {
                    id(cloud_sync_failures) += 5;
                  } else {
                    id(cloud_sync_failures)++;
                  }
              - if:
                  condition:
                    lambda: "return id(cloud_is_registered) && !id(cloud_configuration_syncing);"
                  then:
                    - script.execute: cloud_sync_configuration
          on_error:
            then:
              - lambda: |-
                  id(cloud_sync_failures)++;
                  id(cloud_is_registering) = false;

  - id: cloud_send_batch
    mode: single
    then:
      - if:
          condition:
            not:
              lambda: "return network::is_connected();"
          then:
            - script.stop: cloud_send_batch
      - if:
          condition:
            lambda: "return !id(cloud_is_registered);"
          then:
            - script.execute: cloud_register
            - script.stop: cloud_send_batch

      - if:
          condition:
            lambda: "return id(cloud_device_token).length() == 0;"
          then:
            - lambda: "id(cloud_is_registered) = false;"
            - script.execute: cloud_register
            - script.stop: cloud_send_batch

      - if:
          condition:
            lambda: "return id(cloud_sync_failures) > 10;"
          then:
            - delay: 10min
            - lambda: "id(cloud_sync_failures) = 0;"
            - script.stop: cloud_send_batch

      - lambda: "id(cloud_last_sync_success) = false;"

      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/ingest"
          request_headers:
            Content-Type: "application/json"
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "CeilSense/${project_version}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 256
          json: |-
            root["device_id"] = id(cloud_device_id);
            root["timestamp"] = id(homeassistant_time).now().is_valid()
              ? id(homeassistant_time).now().timestamp
              : id(sntp_time).now().timestamp;

            // Only SCD4x variants publish environmental air-quality values.
            // Basic variants do not have an SCD4x, so these fields must remain absent.
            if (id(cloud_has_scd4x) && !isnan(id(cloud_scd4x_temperature))) {
              root["temperature_c"] = id(cloud_scd4x_temperature);
            }

            if (id(cloud_has_scd4x) && !isnan(id(cloud_scd4x_humidity))) {
              root["humidity_pct"] = id(cloud_scd4x_humidity);
            }

            if (id(cloud_has_scd4x) && !isnan(id(cloud_scd4x_co2))) {
              root["co2_ppm"] = (int) roundf(id(cloud_scd4x_co2));
            }

            if (id(illuminance).has_state() && !isnan(id(illuminance).state)) {
              root["lux"] = id(illuminance).state;
            }

            if (id(bmp_pressure).has_state() && !isnan(id(bmp_pressure).state)) {
              root["pressure_hpa"] = id(bmp_pressure).state;
            }

            if (id(cloud_has_presence)) {
              root["occupancy"] = id(cloud_occupancy);
            }

            if (id(cloud_has_zone_occupancy)) {
              root["zone1_occupancy"] = id(cloud_zone1_occupancy);
              root["zone2_occupancy"] = id(cloud_zone2_occupancy);
              root["zone3_occupancy"] = id(cloud_zone3_occupancy);
              root["zone4_occupancy"] = id(cloud_zone4_occupancy);
            }

            if (id(cloud_has_zone_counts)) {
              if (id(cloud_zone1_target_count) >= 0) root["zone1_target_count"] = id(cloud_zone1_target_count);
              if (id(cloud_zone2_target_count) >= 0) root["zone2_target_count"] = id(cloud_zone2_target_count);
              if (id(cloud_zone3_target_count) >= 0) root["zone3_target_count"] = id(cloud_zone3_target_count);
              if (id(cloud_zone4_target_count) >= 0) root["zone4_target_count"] = id(cloud_zone4_target_count);
            }

            if (id(cpu_temperature).has_state() && !isnan(id(cpu_temperature).state)) {
              root["cpu_temperature_c"] = id(cpu_temperature).state;
            }

            root["firmware_version"] = "${project_version}";
            root["hardware_version"] = "${ceilsense_hardware_version}";
            root["configuration_protocol_version"] = 1;
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(cloud_last_sync_success) = true;
                    id(cloud_sync_failures) = 0;

                    if (id(cloud_first_sync_timestamp) == 0) {
                      auto now = id(homeassistant_time).now().is_valid()
                        ? id(homeassistant_time).now().timestamp
                        : id(sntp_time).now().timestamp;
                      id(cloud_first_sync_timestamp) = now;
                    }

                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["configuration_version"].is<uint32_t>()) {
                        id(cloud_desired_configuration_version) = root["configuration_version"].as<uint32_t>();
                      }
                      return true;
                    });
                  } else if (response->status_code == 401) {
                    id(cloud_is_registered) = false;
                    id(cloud_device_token) = "";
                    id(cloud_sync_failures)++;
                  } else if (response->status_code == 429) {
                    id(cloud_sync_failures) += 5;
                  } else {
                    id(cloud_sync_failures)++;
                  }
              - if:
                  condition:
                    lambda: |-
                      return id(cloud_is_registered)
                        && !id(cloud_configuration_syncing)
                        && (
                          !id(cloud_configuration_boot_sync_done)
                          || id(cloud_desired_configuration_version) != id(cloud_led_configuration_version)
                        );
                  then:
                    - script.execute: cloud_sync_configuration
          on_error:
            then:
              - lambda: |-
                  id(cloud_last_sync_success) = false;
                  id(cloud_sync_failures)++;

  - id: cloud_sync_configuration
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !network::is_connected()
                || !id(cloud_is_registered)
                || id(cloud_device_token).empty()
                || id(cloud_configuration_syncing);
          then:
            - script.stop: cloud_sync_configuration
      - lambda: |-
          id(cloud_configuration_syncing) = true;
          id(cloud_configuration_ack_version) = 0;
          id(cloud_configuration_ack_applied) = false;
          id(cloud_configuration_ack_error) = "";
      - http_request.get:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/configuration"
          request_headers:
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "CeilSense/${project_version}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  id(cloud_configuration_syncing) = false;

                  if (response->status_code != 200) {
                    return;
                  }

                  const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["configuration_version"].is<uint32_t>()
                        || !root["configuration"].is<JsonObject>()) {
                      id(cloud_configuration_ack_error) = "Invalid configuration envelope";
                      return false;
                    }

                    const uint32_t version = root["configuration_version"].as<uint32_t>();
                    JsonObject configuration = root["configuration"].as<JsonObject>();
                    id(cloud_configuration_ack_version) = version;
                    id(cloud_desired_configuration_version) = version;

                    if (!configuration["led_enabled"].is<bool>()) {
                      id(cloud_configuration_ack_error) = "Missing LED enabled setting";
                      return false;
                    }

                    const bool has_presence = configuration["motion_light_enabled"].is<bool>();
                    const bool has_co2 = configuration["co2_alert_enabled"].is<bool>();

                    bool valid = true;
                    int motion_brightness = id(cloud_motion_light_brightness);
                    bool motion_enabled = id(cloud_motion_light_enabled);
                    bool night_enabled = id(cloud_night_light_enabled);
                    int night_brightness = id(cloud_night_light_brightness);
                    int night_start = id(cloud_night_light_start_hour);
                    int night_end = id(cloud_night_light_end_hour);
                    bool co2_enabled = id(cloud_co2_alert_enabled);
                    int co2_warning = id(cloud_co2_warning_ppm);
                    int co2_critical = id(cloud_co2_critical_ppm);
                    int co2_cooldown = id(cloud_co2_alert_cooldown_minutes);

                    if (has_presence) {
                      valid = configuration["motion_light_brightness"].is<int>()
                        && configuration["night_light_enabled"].is<bool>()
                        && configuration["night_light_brightness"].is<int>()
                        && configuration["night_light_start_hour"].is<int>()
                        && configuration["night_light_end_hour"].is<int>();

                      if (valid) {
                        motion_enabled = configuration["motion_light_enabled"].as<bool>();
                        motion_brightness = configuration["motion_light_brightness"].as<int>();
                        night_enabled = configuration["night_light_enabled"].as<bool>();
                        night_brightness = configuration["night_light_brightness"].as<int>();
                        night_start = configuration["night_light_start_hour"].as<int>();
                        night_end = configuration["night_light_end_hour"].as<int>();
                        valid = motion_brightness >= 1 && motion_brightness <= 100
                          && night_brightness >= 1 && night_brightness <= 100
                          && night_start >= 0 && night_start <= 23
                          && night_end >= 0 && night_end <= 23;
                      }
                    }

                    if (valid && has_co2) {
                      valid = configuration["co2_warning_ppm"].is<int>()
                        && configuration["co2_critical_ppm"].is<int>()
                        && configuration["co2_alert_cooldown_minutes"].is<int>();

                      if (valid) {
                        co2_enabled = configuration["co2_alert_enabled"].as<bool>();
                        co2_warning = configuration["co2_warning_ppm"].as<int>();
                        co2_critical = configuration["co2_critical_ppm"].as<int>();
                        co2_cooldown = configuration["co2_alert_cooldown_minutes"].as<int>();
                        valid = co2_warning >= 400 && co2_warning <= 5000
                          && co2_critical >= 500 && co2_critical <= 10000
                          && co2_critical > co2_warning
                          && co2_cooldown >= 1 && co2_cooldown <= 1440;
                      }
                    }

                    if (!valid) {
                      id(cloud_configuration_ack_error) = "Configuration values are outside the supported range";
                      return false;
                    }

                    id(cloud_led_enabled) = configuration["led_enabled"].as<bool>();
                    id(cloud_configuration_has_presence) = has_presence;
                    id(cloud_configuration_has_co2) = has_co2;
                    id(cloud_motion_light_enabled) = motion_enabled;
                    id(cloud_motion_light_brightness) = motion_brightness;
                    id(cloud_night_light_enabled) = night_enabled;
                    id(cloud_night_light_brightness) = night_brightness;
                    id(cloud_night_light_start_hour) = night_start;
                    id(cloud_night_light_end_hour) = night_end;
                    id(cloud_co2_alert_enabled) = co2_enabled;
                    id(cloud_co2_warning_ppm) = co2_warning;
                    id(cloud_co2_critical_ppm) = co2_critical;
                    id(cloud_co2_alert_cooldown_minutes) = co2_cooldown;
                    id(cloud_led_configuration_version) = version;
                    id(cloud_configuration_ack_applied) = true;
                    id(cloud_configuration_ack_error) = "";
                    id(cloud_led_runtime_state) = -1;

                    return true;
                  });

                  if (!parsed && id(cloud_configuration_ack_version) == 0) {
                    id(cloud_configuration_ack_error) = "Unable to parse configuration";
                  }
              - if:
                  condition:
                    lambda: "return id(cloud_configuration_ack_version) > 0;"
                  then:
                    - script.execute: cloud_ack_configuration
          on_error:
            then:
              - lambda: "id(cloud_configuration_syncing) = false;"

  - id: cloud_ack_configuration
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !network::is_connected()
                || !id(cloud_is_registered)
                || id(cloud_device_token).empty()
                || id(cloud_configuration_ack_version) == 0;
          then:
            - script.stop: cloud_ack_configuration
      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/configuration/acknowledge"
          request_headers:
            Content-Type: "application/json"
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "CeilSense/${project_version}"
            Accept: "application/json"
          json: |-
            root["type"] = "configuration_applied";
            root["device_id"] = id(cloud_device_id);
            root["configuration_version"] = id(cloud_configuration_ack_version);
            root["applied"] = id(cloud_configuration_ack_applied);

            JsonObject configuration = root["configuration"].to<JsonObject>();
            configuration["led_enabled"] = id(cloud_led_enabled);

            if (id(cloud_configuration_has_presence)) {
              configuration["motion_light_enabled"] = id(cloud_motion_light_enabled);
              configuration["motion_light_brightness"] = id(cloud_motion_light_brightness);
              configuration["night_light_enabled"] = id(cloud_night_light_enabled);
              configuration["night_light_brightness"] = id(cloud_night_light_brightness);
              configuration["night_light_start_hour"] = id(cloud_night_light_start_hour);
              configuration["night_light_end_hour"] = id(cloud_night_light_end_hour);
            }

            if (id(cloud_configuration_has_co2)) {
              configuration["co2_alert_enabled"] = id(cloud_co2_alert_enabled);
              configuration["co2_warning_ppm"] = id(cloud_co2_warning_ppm);
              configuration["co2_critical_ppm"] = id(cloud_co2_critical_ppm);
              configuration["co2_alert_cooldown_minutes"] = id(cloud_co2_alert_cooldown_minutes);
            }

            if (!id(cloud_configuration_ack_error).empty()) {
              root["error"] = id(cloud_configuration_ack_error);
            }
          capture_response: true
          max_response_buffer_size: 256
          on_response:
            then:
              - if:
                  condition:
                    lambda: "return response->status_code == 200 && id(cloud_configuration_ack_applied);"
                  then:
                    - lambda: "id(cloud_configuration_boot_sync_done) = true;"

  - id: cloud_flash_co2_alert
    mode: single
    parameters:
      critical: bool
    then:
      - lambda: |-
          id(cloud_led_alert_active) = true;
          id(cloud_led_runtime_state) = critical ? 4 : 3;
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: "return critical;"
                then:
                  - light.turn_on:
                      id: status_led
                      brightness: 100%
                      red: 100%
                      green: 0%
                      blue: 0%
                else:
                  - light.turn_on:
                      id: status_led
                      brightness: 100%
                      red: 100%
                      green: 35%
                      blue: 0%
            - delay: 250ms
            - light.turn_off: status_led
            - delay: 250ms
      - lambda: |-
          id(cloud_led_alert_active) = false;
          id(cloud_led_runtime_state) = -1;

  - id: cloud_reset
    mode: single
    then:
      - lambda: |-
          id(cloud_device_id) = "";
          id(cloud_device_token) = "";
          id(cloud_is_registered) = false;
          id(cloud_last_sync_success) = false;
          id(cloud_sync_failures) = 0;
          id(cloud_first_sync_timestamp) = 0;
          id(cloud_last_presence_signature) = -1;
          id(cloud_configuration_boot_sync_done) = false;
      - delay: 5s
      - script.execute: cloud_register

  - id: cloud_send_presence_if_changed
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(cloud_has_presence) && !id(cloud_has_zone_occupancy) && !id(cloud_has_zone_counts);"
          then:
            - script.stop: cloud_send_presence_if_changed
      - if:
          condition:
            lambda: |-
              int signature = id(cloud_occupancy) ? 1 : 0;
              signature = signature * 31 + (id(cloud_zone1_occupancy) ? 1 : 0);
              signature = signature * 31 + (id(cloud_zone2_occupancy) ? 1 : 0);
              signature = signature * 31 + (id(cloud_zone3_occupancy) ? 1 : 0);
              signature = signature * 31 + (id(cloud_zone4_occupancy) ? 1 : 0);
              signature = signature * 31 + id(cloud_zone1_target_count);
              signature = signature * 31 + id(cloud_zone2_target_count);
              signature = signature * 31 + id(cloud_zone3_target_count);
              signature = signature * 31 + id(cloud_zone4_target_count);
              return signature == id(cloud_last_presence_signature);
          then:
            - script.stop: cloud_send_presence_if_changed
      - lambda: |-
          int signature = id(cloud_occupancy) ? 1 : 0;
          signature = signature * 31 + (id(cloud_zone1_occupancy) ? 1 : 0);
          signature = signature * 31 + (id(cloud_zone2_occupancy) ? 1 : 0);
          signature = signature * 31 + (id(cloud_zone3_occupancy) ? 1 : 0);
          signature = signature * 31 + (id(cloud_zone4_occupancy) ? 1 : 0);
          signature = signature * 31 + id(cloud_zone1_target_count);
          signature = signature * 31 + id(cloud_zone2_target_count);
          signature = signature * 31 + id(cloud_zone3_target_count);
          signature = signature * 31 + id(cloud_zone4_target_count);
          id(cloud_last_presence_signature) = signature;
      - script.execute: cloud_send_batch

time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"
    servers:
      - "pool.ntp.org"
      - "time.google.com"

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(startup_complete) || id(debug_mode).state || id(cloud_led_alert_active)) {
            return;
          }

          if (!id(cloud_led_enabled)) {
            if (id(cloud_led_runtime_state) != 0) {
              id(status_led).turn_off().perform();
              id(cloud_led_runtime_state) = 0;
            }
            return;
          }

          int co2_severity = 0;
          if (id(cloud_configuration_has_co2)
              && id(cloud_co2_alert_enabled)
              && id(cloud_has_scd4x)
              && !isnan(id(cloud_scd4x_co2))) {
            if (id(cloud_scd4x_co2) >= id(cloud_co2_critical_ppm)) {
              co2_severity = 2;
            } else if (id(cloud_scd4x_co2) >= id(cloud_co2_warning_ppm)) {
              co2_severity = 1;
            }
          }

          const bool severity_increased = co2_severity > id(cloud_last_co2_alert_severity);
          if (co2_severity != id(cloud_last_co2_alert_severity)) {
            id(cloud_last_co2_alert_severity) = co2_severity;
          }

          const uint32_t cooldown_ms = ((uint32_t) id(cloud_co2_alert_cooldown_minutes)) * 60000UL;
          const uint32_t elapsed_ms = millis() - id(cloud_last_co2_alert_ms);
          if (co2_severity > 0
              && (
                id(cloud_last_co2_alert_ms) == 0
                || elapsed_ms >= cooldown_ms
                || severity_increased
              )) {
            id(cloud_last_co2_alert_ms) = millis();
            id(cloud_flash_co2_alert).execute(co2_severity == 2);
            return;
          }

          if (id(cloud_configuration_has_presence)
              && id(cloud_has_presence)
              && id(cloud_moving_target)
              && id(cloud_motion_light_enabled)) {
            if (id(cloud_led_runtime_state) != 2) {
              auto call = id(status_led).turn_on();
              call.set_brightness(id(cloud_motion_light_brightness) / 100.0f);
              call.set_rgb(1.0f, 1.0f, 1.0f);
              call.perform();
              id(cloud_led_runtime_state) = 2;
            }
            return;
          }

          auto current_time = id(homeassistant_time).now().is_valid()
            ? id(homeassistant_time).now()
            : id(sntp_time).now();
          bool is_night = false;
          if (current_time.is_valid()) {
            const int hour = current_time.hour;
            const int start = id(cloud_night_light_start_hour);
            const int end = id(cloud_night_light_end_hour);
            is_night = start == end
              || (start < end && hour >= start && hour < end)
              || (start > end && (hour >= start || hour < end));
          }

          if (id(cloud_configuration_has_presence)
              && id(cloud_has_presence)
              && id(cloud_still_target)
              && !id(cloud_moving_target)
              && id(cloud_night_light_enabled)
              && is_night) {
            if (id(cloud_led_runtime_state) != 1) {
              auto call = id(status_led).turn_on();
              call.set_brightness(id(cloud_night_light_brightness) / 100.0f);
              call.set_rgb(1.0f, 0.45f, 0.08f);
              call.perform();
              id(cloud_led_runtime_state) = 1;
            }
            return;
          }

          if (id(cloud_led_runtime_state) != 0) {
            id(status_led).turn_off().perform();
            id(cloud_led_runtime_state) = 0;
          }

  - interval: 10s
    then:
      - lambda: |-
          const bool connected = network::is_connected();
          if (connected && !id(cloud_last_network_connected)) {
            id(cloud_configuration_boot_sync_done) = false;
          }
          id(cloud_last_network_connected) = connected;

  - interval: ${cloud_presence_sync_interval}
    then:
      - script.execute: cloud_send_presence_if_changed

  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: "return network::is_connected();"
              - lambda: "return !id(cloud_is_registered) && !id(cloud_is_registering);"
          then:
            - script.execute: cloud_register

  - interval: ${cloud_sync_interval}
    then:
      - script.execute: cloud_send_batch

  - interval: 6h
    then:
      - script.execute: cloud_sync_configuration

# Cloud-only customers may never connect Home Assistant. Without this the
# native API reboots the device every 15 minutes ("No clients; rebooting"),
# so disable the no-client reboot on cloud firmware.
api:
  reboot_timeout: 0s
