# Reports post-flash factory checks to the SmartHomeShop web installer.
substitutions:
  factory_test_profile: "ceilsense-v1"
  factory_test_definitions: '{"id":"firmware","label":"Firmware startup"},{"id":"bh1750","label":"BH1750 light sensor"},{"id":"bmp3xx","label":"BMP3xx pressure sensor"},{"id":"network","label":"Network interface"},{"id":"status_led","label":"Status LED ring"}'
  factory_test_network_detail: "Not tested - verify during final network setup"

globals:
  - id: shs_test_radar_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: shs_test_scd41_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: shs_test_bh1750_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: shs_test_bmp3xx_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: shs_test_manual_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: shs_test_failed
    type: bool
    restore_value: no
    initial_value: "false"

esphome:
  on_boot:
    - priority: 595
      then:
        - lambda: |-
            ESP_LOGI("shs_test", R"(SHS_TEST/1 {"type":"begin","profile":"${factory_test_profile}","timeout":25,"tests":[${factory_test_definitions}]})");
            ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"firmware\",\"status\":\"pass\",\"detail\":\"CeilSense firmware started\"}");

    - priority: 575
      then:
        - delay: 2s
        - component.update: illuminance
        - wait_until:
            condition:
              lambda: return id(illuminance).has_state() && !isnan(id(illuminance).state);
            timeout: 6s
        - if:
            condition:
              lambda: return id(illuminance).has_state() && !isnan(id(illuminance).state);
            then:
              - lambda: |-
                  ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"bh1750\",\"status\":\"pass\",\"value\":%.1f,\"unit\":\"lx\"}", id(illuminance).state);
            else:
              - lambda: |-
                  id(shs_test_failed) = true;
                  ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"bh1750\",\"status\":\"fail\",\"detail\":\"No illuminance measurement\"}");
        - lambda: id(shs_test_bh1750_done) = true;

    - priority: 565
      then:
        - delay: 2s
        - component.update: bmp3xx_sensor
        - wait_until:
            condition:
              lambda: return id(bmp_pressure).has_state() && !isnan(id(bmp_pressure).state);
            timeout: 6s
        - if:
            condition:
              lambda: return id(bmp_pressure).has_state() && !isnan(id(bmp_pressure).state);
            then:
              - lambda: |-
                  ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"bmp3xx\",\"status\":\"pass\",\"value\":%.1f,\"unit\":\"hPa\"}", id(bmp_pressure).state);
            else:
              - lambda: |-
                  id(shs_test_failed) = true;
                  ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"bmp3xx\",\"status\":\"fail\",\"detail\":\"No pressure measurement\"}");
        - lambda: id(shs_test_bmp3xx_done) = true;

    - priority: 550
      then:
        - lambda: |-
            ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"network\",\"status\":\"skip\",\"detail\":\"${factory_test_network_detail}\"}");
            ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"test\",\"id\":\"status_led\",\"status\":\"skip\",\"detail\":\"Manual check - confirm the circular LED animation is visible\"}");
            id(shs_test_manual_done) = true;

    - priority: 500
      then:
        - wait_until:
            condition:
              lambda: |-
                return id(shs_test_radar_done) && id(shs_test_scd41_done) &&
                       id(shs_test_bh1750_done) && id(shs_test_bmp3xx_done) &&
                       id(shs_test_manual_done);
            timeout: 22s
        - lambda: |-
            const bool finished =
              id(shs_test_radar_done) && id(shs_test_scd41_done) &&
              id(shs_test_bh1750_done) && id(shs_test_bmp3xx_done) &&
              id(shs_test_manual_done);
            const bool passed = finished && !id(shs_test_failed);
            ESP_LOGI("shs_test", "SHS_TEST/1 {\"type\":\"result\",\"status\":\"%s\"}", passed ? "pass" : "fail");
